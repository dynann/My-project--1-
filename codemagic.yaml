workflows:
  unity-ios-workflow:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity-credentials
      vars:
        UNITY_VERSION: 6000.3.8f1
        UNITY_CHANGESET: 1c7db571dde0
        UNITY_BIN: /Applications/Unity/Hub/Editor/6000.3.8f1/Unity.app/Contents/MacOS/Unity
        UNITY_HUB: /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub
        XCODE_PROJECT: Builds/iOS/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone

    scripts:
      - name: Install Unity Hub
        script: |
          brew install --cask unity-hub
          echo "Unity Hub installed"

      - name: Install Unity Editor + iOS module
        script: |
          "$UNITY_HUB" -- --headless install \
            --version $UNITY_VERSION \
            --changeset $UNITY_CHANGESET \
            -m ios
          echo "Unity $UNITY_VERSION installed"

      - name: Activate Unity Personal license
        script: |
          "$UNITY_BIN" -batchmode -quit \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile /dev/stdout || true

      - name: Build Unity iOS project
        script: |
          "$UNITY_BIN" -batchmode -quit \
            -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildScript.PerformBuild \
            -logFile /dev/stdout

      - name: Check Unity export output
        script: |
          echo "=== Checking for Xcode project ==="
          find . -name "*.xcodeproj" 2>/dev/null
          echo "=== Listing Builds/iOS folder ==="
          ls -la Builds/iOS/ || echo "Builds/iOS/ folder does not exist"

      - name: Build Xcode project (IPA)
        script: |
          set -e
          set -o pipefail
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"

    publishing:
      email:
        recipients:
          - tommyhank300@gmail.com
        notify:
          success: true
          failure: true