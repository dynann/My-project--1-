workflows:
  unity-ios-workflow:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity-credentials
      vars:
        UNITY_VERSION: 6000.3.8f1
        UNITY_CHANGESET: 1c7db571dde0
        XCODE_PROJECT: Builds/iOS/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone

    scripts:
      - name: Install Unity Hub
        script: |
          brew install --cask unity-hub
          echo "=== Unity Hub installed ==="
          ls -la "/Applications/Unity Hub.app/Contents/MacOS/" || echo "Hub path not found"

      - name: Install Unity Editor + iOS module
        script: |
          "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install \
            --version "$UNITY_VERSION" \
            --changeset "$UNITY_CHANGESET" \
            -m ios
          echo "=== Unity install complete ==="
          find /Applications/Unity -name "Unity" -type f 2>/dev/null || echo "Unity binary not found after install"

      - name: Activate and Build Unity iOS project
        script: |
          # Find Unity dynamically
          UNITY_BIN=$(find /Applications/Unity/Hub/Editor -name "Unity" -maxdepth 5 -type f 2>/dev/null | grep "MacOS/Unity$" | head -1)
          if [ -z "$UNITY_BIN" ]; then
            echo "ERROR: Unity binary not found! Listing /Applications/Unity:"
            ls -la /Applications/Unity/ || echo "Directory does not exist"
            exit 1
          fi
          echo "Found Unity at: $UNITY_BIN"

          # Activate license
          "$UNITY_BIN" -batchmode -quit \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile /dev/stdout || true

          # Build iOS
          "$UNITY_BIN" -batchmode -quit \
            -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildScript.PerformBuild \
            -logFile /dev/stdout

      - name: Check Unity export output
        script: |
          echo "=== Checking for Xcode project ==="
          find . -name "*.xcodeproj" 2>/dev/null
          echo "=== Listing Builds/iOS folder ==="
          ls -la Builds/iOS/ || echo "Builds/iOS/ folder does not exist"

      - name: Build Xcode project (IPA)
        script: |
          set -e
          set -o pipefail
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"

    publishing:
      email:
        recipients:
          - tommyhank300@gmail.com
        notify:
          success: true
          failure: true