scripts:
  - name: Activate Unity license
    script: |
      $UNITY_BIN -batchmode -quit \
        -serial $UNITY_SERIAL \
        -username $UNITY_EMAIL \
        -password $UNITY_PASSWORD

  - name: Build Unity iOS project
    script: |
      $UNITY_BIN -batchmode -quit \
        -projectPath . \
        -buildTarget iOS \
        -executeMethod BuildScript.PerformBuild \
        -logFile /dev/stdout
    ignore_failure: false  # make sure this STOPS if Unity fails

  - name: Check Unity export output        # ← ADD THIS
    script: |
      echo "=== Checking for Xcode project ==="
      find . -name "*.xcodeproj" 2>/dev/null
      echo "=== Checking for ios folder ==="
      ls -la ios/ || echo "ios/ folder does not exist"

  - name: Build Xcode project
    script: |
      set -e
      set -o pipefail
      xcode-project use-profiles
      xcode-project build-ipa \
        --project $XCODE_PROJECT \
        --scheme Unity-iPhone

artifacts:
  - "**/*.ipa"