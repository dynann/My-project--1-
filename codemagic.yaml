workflows:
  unity-ios-workflow:
    name: Unity iOS Build
    max_build_duration: 60

    environment:
      unity: 2022.3
      xcode: latest
      cocoapods: default

    scripts:
      - name: Activate Unity license
        script: |
          echo "Unity activation required - skip if already handled in Codemagic UI"

      - name: Build iOS
        script: |
          /Applications/Unity/Hub/Editor/2022.3.0f1/Unity.app/Contents/MacOS/Unity \
          -batchmode \
          -quit \
          -projectPath . \
          -executeMethod BuildScript.BuildiOS \
          -logFile build.log

    artifacts:
      - build/**/*